name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Las comprobaciones solo leen el código.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Cada prueba crea su propio esquema en esta base y lo borra al terminar.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formato (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Estos archivos no están formateados con gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Análisis estático (go vet)
        run: go vet ./...

      - name: Compilar
        run: go build ./...

      - name: Pruebas
        run: go test -race -count=1 ./...

  docker:
    name: Imagen Docker del backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Solo construye para comprobar que el Dockerfile funciona; no publica nada.
      - name: Construir imagen
        run: docker build --tag micolmena-api:ci backend

  # El frontend lo publica Vercel solo; aquí se publica el backend en el VPS.
  deploy-backend:
    name: Publicar backend en el VPS
    needs: [backend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ubuntu@15.235.62.27

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Llave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # El .env y los datos viven solo en el servidor: no se tocan.
      - name: Subir código
        run: rsync -az --delete --exclude .env --exclude data/ backend docker-compose.yml "$HOST:~/micolmena/"

      # Compose solo recrea la API si la imagen cambió; luego se borran las imágenes viejas.
      - name: Reconstruir y arrancar
        run: ssh "$HOST" 'cd ~/micolmena && docker compose up -d --build && docker image prune -f'

      - name: Comprobar que responde
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://vps-c435342e.vps.ovh.ca/api/health

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Con el npm 10 que trae Node 22, la instalación falla por un bug al resolver dependencias "peer".
      - name: Actualizar npm
        run: npm install --global npm@11

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (svelte-check)
        run: npm run check

      - name: Formato y lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm run test:unit -- --run

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        run: npm run test:e2e

      - name: Guardar trazas si fallan las E2E
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
